# Dependabot version updates. Every pull request is reviewed by hand; labels per the shared standard (labels v2).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]
    # codeql-action init, analyze and upload-sarif must move together (one version), so they share one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies"]

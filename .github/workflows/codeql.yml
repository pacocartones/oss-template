name: CodeQL

# Thin caller: the logic lives in pacocartones/.github (docs: its README, "codeql").
# Pull requests (no paths filter: it is a required check), weekly on main, and by hand.
# Set `language` to the project's language (javascript-typescript, python, actions, ...);
# it is part of the required check name, so rerun scripts/bootstrap.sh after changing it.
#
# Pinning: @main is a placeholder that runs whatever is on main today. Replace it
# with a full commit SHA, keeping the branch and date as a comment:
#   git ls-remote https://github.com/pacocartones/.github refs/heads/main
#   uses: pacocartones/.github/.github/workflows/codeql.yml@<40-char sha> # main YYYY-MM-DD
# A SHA cannot move; take a newer one in a pull request so CI runs on it.
on:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # 04:00 UTC every Monday
  workflow_dispatch: {}

permissions: {}

jobs:
  # The job id is part of the required check name "codeql / Analyze (javascript-typescript)" (scripts/bootstrap.sh).
  codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: pacocartones/.github/.github/workflows/codeql.yml@main
    with:
      language: javascript-typescript

name: Verify

# Thin caller: the logic lives in pacocartones/.github (docs: its README, "verify").
# No paths filter on pull_request: this is a required check, and a filtered-out
# required check never reports, blocking the pull request forever.
#
# Pinning: a full commit SHA of pacocartones/.github, with the branch and the day it was
# read as a comment. All three callers use the same SHA (scripts/workflows.test.mjs).
# A SHA cannot move; to take a newer one, in a pull request so CI runs on it:
#   git ls-remote https://github.com/pacocartones/.github refs/heads/main
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # The job id is part of the required check name "verify / Verify" (scripts/bootstrap.sh).
  verify:
    permissions:
      contents: read
    uses: pacocartones/.github/.github/workflows/verify.yml@927bf3956ca4d0e409f4f3eaf0872764d8bb2394 # main 2026-11-27

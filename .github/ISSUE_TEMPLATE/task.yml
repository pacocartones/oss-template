# Adapted from the GitHub Docs issue-form examples (github/docs commit df6faa2, CC BY 4.0,
# https://creativecommons.org/licenses/by/4.0/). Modified: a minimal form with the account's Task type,
# which also covers upkeep the retired chore label used to mark.
name: Task
description: A specific piece of work, such as upkeep, CI or a dependency.
type: Task
body:
  - type: textarea
    id: task
    attributes:
      label: What needs to be done
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we will know the task is finished.

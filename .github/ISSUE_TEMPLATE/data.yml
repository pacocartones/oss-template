# Adapted from the GitHub Docs issue-form examples (github/docs commit df6faa2, CC BY 4.0,
# https://creativecommons.org/licenses/by/4.0/) and vitejs/vite .github/ISSUE_TEMPLATE/docs.yml
# (commit 7d0c054, MIT, Copyright (c) 2019-present, VoidZero Inc. and Vite contributors;
# notice in THIRD_PARTY.md). Modified: the Docs form's structure reused for data the project publishes, with the account's Data type and a required source.
name: Data correction
description: Add, correct or re-verify a fact the project publishes.
type: Data
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this issue!
  - type: checkboxes
    id: data_is
    attributes:
      label: The data is
      options:
        - label: Missing
        - label: Wrong
        - label: Outdated
        - label: Not sure?
  - type: textarea
    id: description
    attributes:
      label: Explain in Detail
      description: Which entry or file, what it says now and what it should say.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A public URL that shows the correct value.
    validations:
      required: true

# Adapted from the GitHub Docs issue-form examples (github/docs commit df6faa2, CC BY 4.0,
# https://creativecommons.org/licenses/by/4.0/) and vitejs/vite .github/ISSUE_TEMPLATE/feature_request.yml
# (commit 7d0c054, MIT, Copyright (c) 2019-present, VoidZero Inc. and Vite contributors;
# notice in THIRD_PARTY.md). Modified: type set to the account's Feature type, no labels, Vite links removed.
name: Feature request
description: Propose a new feature or a change to an existing one.
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in the project and taking the time to fill out this feature report!
  - type: textarea
    id: feature-description
    attributes:
      label: Description
      description: "Clear and concise description of the problem. Please make the reason and usecases as detailed as possible. If you intend to submit a PR for this issue, tell us in the description. Thanks!"
      placeholder: As a user I want [goal / wish] so that [benefit].
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested solution
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternative
      description: Clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Any other context or screenshots about the feature request here.
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Follow our Code of Conduct (CODE_OF_CONDUCT.md).
          required: true
        - label: Check that there isn't already an issue that request the same feature to avoid creating a duplicate.
          required: true

# Adapted from the GitHub Docs issue-form examples (github/docs commit df6faa2, CC BY 4.0,
# https://creativecommons.org/licenses/by/4.0/) and vitejs/vite .github/ISSUE_TEMPLATE/bug_report.yml
# (commit 7d0c054, MIT, Copyright (c) 2019-present, VoidZero Inc. and Vite contributors;
# notice in THIRD_PARTY.md). Modified: type set to the account's Bug type, no labels, Vite-specific fields removed.
name: Bug report
description: Something does not work as documented.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Security problems go through SECURITY.md, not an issue.
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. If you intend to submit a PR for this issue, tell us in the description. Thanks!
      placeholder: I am doing ... What I expect is ... What actually happening is ...
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. In this environment...
        1. With this config...
        1. Run '...'
        1. See error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of our software are you running?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, runtime and anything else relevant.
      value: |
        - OS:
        - Runtime:
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Validations
      description: Before submitting the issue, please make sure you do the following
      options:
        - label: Follow our Code of Conduct (CODE_OF_CONDUCT.md).
          required: true
        - label: Check that this is a concrete bug. For questions, see SUPPORT.md.
          required: true
